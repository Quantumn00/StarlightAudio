<title>Starlight Player</title>
<style>
:root{
  --bg:#0d0a1a; --card:rgba(255,255,255,.075); --card2:rgba(255,255,255,.13);
  --pink:#ff9ecb; --blue:#9fd4ff; --lilac:#c9a8ff; --ink:#2a1646;
  --grad:linear-gradient(135deg,#ff9ecb,#c9a8ff); --sub:rgba(255,255,255,.66);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block}
#bg,#nowBg{position:fixed;inset:0;background-size:cover;background-position:center top}
#bgShade{position:fixed;inset:0;background:linear-gradient(180deg,rgba(13,10,26,.5) 0%,rgba(13,10,26,.86) 38%,rgba(13,10,26,.95) 100%)}
.screen{position:fixed;inset:0;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(var(--sat) + 14px) 16px calc(150px + var(--sab))}
.screen.on{display:block}
h1{font-size:28px;line-height:1.15;margin:0;font-weight:800;letter-spacing:-.4px}
h2{font-size:20px;margin:0;font-weight:800;letter-spacing:-.2px}
.top{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px}
.sec{margin-top:26px}.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.link{font-size:13px;color:var(--sub);font-weight:600}
.muted{color:var(--sub);font-size:13px;line-height:1.5}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar,.shelf::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 15px;border-radius:99px;background:var(--card2);font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:#fff;color:var(--ink)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.qt{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:8px;overflow:hidden;text-align:left;font-weight:700;font-size:14px;min-width:0;padding-right:8px}
.qt span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qi{width:52px;height:52px;flex:none;object-fit:cover;display:grid;place-items:center}
.ph{background:linear-gradient(135deg,#4a3a7a,#2c2150);display:grid;place-items:center;color:var(--sub)}
.shelf{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.tc{flex:none;width:144px;scroll-snap-align:start;text-align:left;min-width:0}
.tc .cv{width:144px;height:144px;border-radius:10px;object-fit:cover;display:grid}
.tc .cv.round{border-radius:50%}
.tc .t{margin-top:8px;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc .a{font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.skel .tc .cv,.skel .tc .t,.skel .tc .a{background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.14),rgba(255,255,255,.06));background-size:200% 100%;animation:sh 1.3s infinite;color:transparent;border-radius:8px}
.skel .tc .t,.skel .tc .a{height:12px;width:80%}
@keyframes sh{to{background-position:-200% 0}}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:7px 4px;border-radius:12px;min-width:0}
.row:active{background:var(--card)}
.row .sq{width:52px;height:52px;border-radius:6px;object-fit:cover;flex:none}
.row.now .t{color:var(--pink)}
.num{width:22px;text-align:center;color:var(--sub);font-size:14px;flex:none}
.meta{flex:1;min-width:0}
.t{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.4px;padding:1.5px 5px;border-radius:4px;margin-right:6px;border:1px solid rgba(255,255,255,.3);color:var(--sub);vertical-align:1px}
.tag.full{background:var(--grad);color:var(--ink);border-color:transparent}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
.ib.on{color:var(--pink)}
.ib:active{background:var(--card2)}
.btn{padding:11px 18px;border-radius:99px;background:var(--grad);color:var(--ink);font-weight:800;font-size:14px}
.btn.ghost{background:var(--card2);color:#fff;font-weight:700}
.pill{display:flex;align-items:center;gap:8px;padding:11px 18px;border-radius:99px;font-weight:800;font-size:15px}
.pill.go{background:var(--grad);color:var(--ink)}
.pill.alt{background:var(--card2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid .tc{width:auto}.grid .tc .cv{width:100%;height:auto;aspect-ratio:1}
.mosaic{display:grid;grid-template-columns:1fr 1fr;width:100%;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#2c2150}
.mosaic img,.mosaic div{width:100%;height:100%;object-fit:cover}

/* search */
.sbar{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.94);color:#1a1230;border-radius:12px;padding:0 6px 0 14px;height:50px;margin-top:4px}
.sbar input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:17px;color:#1a1230;font-weight:600;height:100%;-webkit-appearance:none}
.sbar input::placeholder{color:#6b6482;font-weight:500}
.sbar input::-webkit-search-cancel-button{display:none}
.sbar .ib{color:#1a1230;width:36px;height:36px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px;margin:12px 0 4px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:13px;font-weight:700;color:var(--sub);white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink)}
.browse{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.bt{height:92px;border-radius:10px;padding:12px;text-align:left;font-weight:800;font-size:17px;position:relative;overflow:hidden;color:#fff}
.bt i{position:absolute;right:-10px;bottom:-8px;width:62px;height:62px;border-radius:10px;background:rgba(0,0,0,.2);transform:rotate(25deg)}
.recentq{display:flex;align-items:center;gap:12px;padding:10px 2px}
.recentq .t{font-weight:600;flex:1}
.topres{display:flex;flex-direction:column;gap:12px;background:var(--card);border-radius:14px;padding:16px;margin-top:6px;text-align:left;width:100%}
.topres .cv{width:92px;height:92px;border-radius:8px;object-fit:cover}
.topres .cv.round{border-radius:50%}
.topres h3{margin:0;font-size:24px;font-weight:800;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;padding:40px 10px;color:var(--sub);line-height:1.5}
.newpl{display:flex;gap:8px;margin:6px 0 18px}
.newpl input,.sheet-in{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:0;background:var(--card2);color:#fff;font-size:16px;outline:0}
::placeholder{color:var(--sub)}

/* page overlay */
#page{position:fixed;inset:0;z-index:4;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:linear-gradient(180deg,rgba(40,24,80,.9),rgba(13,10,26,.97) 340px);padding:0 16px calc(150px + var(--sab))}
#page.on{display:block}
.pg-top{position:sticky;top:0;display:flex;align-items:center;gap:6px;padding:calc(var(--sat) + 6px) 0 8px;z-index:2}
.pg-title{font-weight:800;font-size:16px;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:6px 0 16px}
.pg-hero .cover{width:190px;height:190px;border-radius:10px;object-fit:cover;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.pg-hero .cover.round{border-radius:50%}
.pg-hero .mosaic{width:190px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.pg-hero h1{margin-top:10px}
.pg-btns{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;justify-content:center}

/* mini + tabs */
#mini{position:fixed;left:8px;right:8px;bottom:calc(64px + var(--sab));display:none;align-items:center;gap:10px;padding:7px 8px 9px 7px;
  border-radius:12px;background:rgba(48,32,92,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:5;box-shadow:0 6px 24px rgba(0,0,0,.4)}
#mini.on{display:flex}
#mini img{width:42px;height:42px;border-radius:6px;object-fit:cover;background:#3a2a60}
#miniBar{position:absolute;left:10px;right:10px;bottom:3px;height:2px;background:rgba(255,255,255,.2);border-radius:2px}
#miniBar i{display:block;height:100%;width:0;background:#fff;border-radius:2px}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;padding:8px 10px calc(6px + var(--sab));z-index:6;
  background:linear-gradient(180deg,rgba(13,10,26,.82),rgba(13,10,26,.98));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--sub);padding:3px 0}
#tabs button.on{color:#fff}
#tabs button.on svg{color:var(--pink)}

/* now playing */
#now{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;padding:calc(var(--sat) + 8px) 22px calc(14px + var(--sab));overflow:hidden}
#now.on{display:flex}
#nowBg{z-index:-2}
#nowShade{position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(13,10,26,.45) 0%,rgba(13,10,26,.8) 50%,rgba(13,10,26,.95) 100%)}
#nowTop{display:flex;align-items:center;justify-content:space-between;flex:none}
.np-h{text-align:center;min-width:0}.np-h small{display:block;font-size:10px;letter-spacing:1.2px;color:var(--sub);font-weight:700}
.np-h b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
#npView{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin:6px 0}
#artWrap{width:100%;display:grid;place-items:center}
#art{width:min(100%,46vh,360px);aspect-ratio:1;border-radius:14px;object-fit:cover;background:#3a2a60;box-shadow:0 24px 60px rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.85)}
#npLyr,#npQ{width:100%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 2px}
#npLyr p{font-size:23px;font-weight:800;line-height:1.3;margin:0 0 16px;color:rgba(255,255,255,.35);transition:color .25s,transform .25s;transform-origin:left}
#npLyr p.on{color:#fff;transform:scale(1.02)}
#npLyr.plain p{color:#fff;font-size:18px;font-weight:600;margin-bottom:10px}
.np-info{display:flex;align-items:center;gap:10px;flex:none}
#nTitle{font-size:22px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.3px}
#nArtist{color:var(--sub);font-size:15px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
#seek{width:100%;margin:12px 0 0;accent-color:#fff;height:22px}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);flex:none;margin-top:-2px}
.ctl{display:flex;justify-content:space-between;align-items:center;margin:8px 0 6px;flex:none}
.ctl .ib{width:52px;height:52px}
.ctl .big{width:70px;height:70px;background:#fff;color:var(--ink)}
.ctl .on{color:var(--pink)}
.xtra{display:flex;justify-content:space-around;flex:none;padding-top:2px}
.xtra .ib{width:48px;height:44px;font-size:12px;font-weight:800;border-radius:12px;flex-direction:column}
.xtra .ib.on{background:var(--card2)}
.q-row{display:flex;align-items:center;gap:12px;padding:7px 2px}
.q-row img{width:44px;height:44px;border-radius:6px;object-fit:cover}
.q-row.now .t{color:var(--pink)}

/* sheet + toast */
#sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:none;align-items:flex-end}
#sheet.on{display:flex}
#sheetBox{width:100%;max-height:78%;overflow:auto;background:#1e1538;border-radius:20px 20px 0 0;padding:14px 12px calc(16px + var(--sab))}
.sh-grab{width:40px;height:4px;border-radius:4px;background:rgba(255,255,255,.25);margin:0 auto 12px}
.sh-head{display:flex;align-items:center;gap:12px;padding:4px 6px 12px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:6px}
.sh-head .sq{width:52px;height:52px;border-radius:6px;object-fit:cover}
.sh-item{display:flex;align-items:center;gap:16px;width:100%;padding:13px 8px;font-size:16px;font-weight:600;text-align:left;border-radius:10px;color:#fff;text-decoration:none}
.sh-item:active{background:var(--card2)}
.sh-item svg{color:var(--sub)}
#toast{position:fixed;top:calc(var(--sat) + 10px);left:50%;transform:translateX(-50%);z-index:50;background:#fff;color:var(--ink);padding:9px 16px;border-radius:99px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;text-align:center}
#toast.on{opacity:1}
.set{background:var(--card);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.set b{font-size:15px}
.set .seg{margin:0}
.row2{display:flex;align-items:center;gap:10px}.row2 span.l{width:104px;font-size:14px}.row2 .seg{flex:1}
</style>
</head>
<body>
<div id="bg"></div><div id="bgShade"></div>

<main>
  <section class="screen on" id="s-home"></section>
  <section class="screen" id="s-search"></section>
  <section class="screen" id="s-library"></section>
  <section class="screen" id="s-settings"></section>
</main>
<section id="page"></section>

<div id="mini">
  <img id="mImg" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">
  <div class="meta" id="mOpen"><div class="t" id="mT"></div><div class="a" id="mA"></div></div>
  <button class="ib" id="mLike" aria-label="Like"></button>
  <button class="ib" id="mPlay" aria-label="Play or pause"></button>
  <div id="miniBar"><i id="miniFill"></i></div>
</div>

<nav id="tabs">
  <button data-tab="home" class="on"><span data-ic="home"></span>Home</button>
  <button data-tab="search"><span data-ic="search"></span>Search</button>
  <button data-tab="library"><span data-ic="library"></span>Your Library</button>
  <button data-tab="settings"><span data-ic="gear"></span>Settings</button>
</nav>

<section id="now">
  <div id="nowBg"></div><div id="nowShade"></div>
  <header id="nowTop">
    <button class="ib" id="nClose" data-ic="down" aria-label="Close"></button>
    <div class="np-h"><small>PLAYING FROM</small><b id="nCtx">Your queue</b></div>
    <button class="ib" id="nMore" data-ic="dots" aria-label="More"></button>

  <div id="npView">
    <div id="artWrap"><img id="art" alt=""></div>
    <div id="npLyr" hidden></div>
    <div id="npQ" hidden></div>
  </div>
  <div class="np-info">
    <div class="meta"><div id="nTitle"></div><div id="nArtist"></div></div>
    <button class="ib" id="nLike" aria-label="Like"></button>
  </div>
  <input type="range" id="seek" min="0" max="1000" value="0">
  <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
  <div class="ctl">
    <button class="ib" id="bShuf" data-ic="shuffle" aria-label="Shuffle"></button>
    <button class="ib" id="bPrev" data-ic="prev" aria-label="Previous"></button>
    <button class="ib big" id="bPlay" aria-label="Play or pause"></button>
    <button class="ib" id="bNext" data-ic="next" aria-label="Next"></button>
    <button class="ib" id="bRep" data-ic="repeat" aria-label="Repeat"></button>
  </div>
  <div class="xtra">
    <button class="ib" id="bLyr" aria-label="Lyrics"></button>
    <button class="ib" id="bQ" aria-label="Queue"></button>
    <button class="ib" id="bSleep" aria-label="Sleep timer"></button>
    <button class="ib" id="bSpd" aria-label="Speed">1×</button>
  </div>
</section>

<div id="sheet"><div id="sheetBox"></div></div>
<div id="toast"></div>

const ORDER = ["deezer", "itunes", "audius"];
const srcList = () => S.srcMode === "all" ? ORDER : [S.srcMode];
function interleave(lists) { const out = []; const n = Math.max(0, ...lists.map(l => l.length)); for (let i = 0; i < n; i++) lists.forEach(l => { if (l[i]) out.push(l[i]); }); return out; }

  const ss = srcList(); let ok = 0, bad = 0;
  const run = kind => Promise.allSettled(ss.map(s => P[s][kind](q))).then(rs => rs.map(r => { if (r.status === "fulfilled") { ok++; return r.value || []; } bad++; return []; }));
  const [tr, ar, al] = await Promise.all([run("tracks"), run("artists"), run("albums")]);
  return {
    songs: dedupe(interleave(tr), t => norm(t.title) + "|" + norm(t.artist)),
    artists: dedupe(interleave(ar), a => norm(a.name)),
    albums: dedupe(interleave(al), a => norm(a.name) + "|" + norm(a.sub)),
    err: ok === 0 && bad > 0

}
async function fresh(t) {
  if (t.src !== "deezer" || !t.id || Date.now() - (t.ts || 0) < 4 * 3600e3) return t;
  try { const d = await jsonp("https://api.deezer.com/track/" + t.id + "?output=jsonp"); if (d && d.preview) { t.url = d.preview; t.ts = Date.now(); } } catch (e) {}
  return t;
}
/* lyrics (LRCLIB, free, no key) */
const parseLrc = s => s.split("\n").map(l => { const m = l.match(/^\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)$/); return m ? { t:+m[1] * 60 + +m[2], x:m[3] } : null; }).filter(Boolean);
async function getLyrics(t) {
  if (S.lyr[t.key] !== undefined) return S.lyr[t.key];
  let r = null;
  try { r = await getJ("https://lrclib.net/api/get?track_name=" + enc(t.title) + "&artist_name=" + enc(t.artist) + (t.full && t.dur ? "&duration=" + t.dur : "")); }
  catch (e) { try { const l = await getJ("https://lrclib.net/api/search?q=" + enc(t.title + " " + t.artist)); r = Array.isArray(l) ? l[0] : null; } catch (e2) {} }
  let out = null;
  if (r && r.syncedLyrics) { const lines = parseLrc(r.syncedLyrics); if (lines.length) out = { synced:true, lines }; }
  if (!out && r && r.plainLyrics) out = { synced:false, lines:r.plainLyrics.split("\n").map(x => ({ x })) };
  S.lyr[t.key] = out; return out;
}

    '<div class="set"><b>Powered by</b><div class="muted">Audius public API · Deezer API · Apple iTunes Search API · LRCLIB lyrics. Audio plays through a standard HTML5 player. Credit goes to the artists.</div></div>';
}

/* ============ navigation ============ */
function go(tab) {
  S.tab = tab; S.pages = []; renderPage();
  $$(".screen").forEach(s => s.classList.remove("on")); $("#s-" + tab).classList.add("on");
  $$("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  applyBg(tab);
  if (tab === "home") renderHome(); else if (tab === "search") buildSearch(); else if (tab === "library") renderLibrary(); else renderSettings();
  $("#s-" + tab).scrollTop = 0;
}
function openPage(spec) { S.pages.push(spec); renderPage(); }
function renderPage() {
  const spec = S.pages[S.pages.length - 1], el = $("#page");
  if (!spec) { el.classList.remove("on"); el.innerHTML = ""; return; }
  el.classList.add("on"); el.scrollTop = 0; const tok = ++S.pTok;
  const cover = spec.mosaic ? (spec.mosaic.length >= 4 ? mosaic(spec.mosaic) : imgH(spec.mosaic[0] && spec.mosaic[0].art, "cover")) : imgH(spec.img, "cover" + (spec.round ? " round" : ""), spec.title);
  el.innerHTML = '<div class="pg-top"><button class="ib" data-act="back" aria-label="Back">' + ic("back", 26) + '</button><div class="pg-title" id="pgT">' + esc(spec.title) + "</div></div>" +
    '<div class="pg-hero">' + cover + "<h1>" + esc(spec.title) + '</h1><div class="muted">' + esc(spec.sub || "") + '</div><div class="pg-btns" id="pgBtns" hidden><button class="pill go" data-act="pgPlay">' + ic("play", 18) + 'Play</button><button class="pill alt" data-act="pgShuf">' + ic("shuffle", 18) + "Shuffle</button>" +
    (spec.ctx && spec.ctx.playlist ? '<button class="pill alt" data-act="pgDel">' + ic("trash", 18) + "Delete</button>" : "") + '</div></div><div id="pgList"><div class="shelf skel" style="margin:0">' + skel(3) + "</div></div>";
  Promise.resolve().then(() => spec.load()).then(arr => {
    if (tok !== S.pTok) return; S.pageTracks = arr || [];
    $("#pgBtns").hidden = !S.pageTracks.length;
    $("#pgList").innerHTML = S.pageTracks.length ? rowsH(S.pageTracks, Object.assign({ name:spec.title }, spec.ctx || {}), { num:true, noAlbum:!!spec.round }) : '<div class="empty">Nothing to show here yet.</div>';
  }).catch(() => { if (tok === S.pTok) $("#pgList").innerHTML = '<div class="empty">Couldn\'t load this one. Check your connection and go back to try again.</div>'; });
}
function openCard(o) {
  saveQuery(S.q);
  if (o.kind === "artist") openPage({ title:o.name, sub:o.sub || "Artist", img:o.img, round:true, load:() => P[o.src].artistTracks(o.id, o) });
  else openPage({ title:o.name, sub:o.sub || "Album", img:o.img, load:() => P[o.src].albumTracks(o.id, o) });
}
const openPlaylist = n => openPage({ title:n, sub:(S.playlists[n] || []).length + " songs", mosaic:S.playlists[n] || [], ctx:{ playlist:n }, load:() => S.playlists[n] || [] });
const openLiked = () => openPage({ title:"Liked Songs", sub:S.liked.length + " songs", mosaic:S.liked, ctx:{ liked:true }, load:() => S.liked });
const openRecent = () => openPage({ title:"Recently played", sub:"Your last " + S.recent.length + " songs", mosaic:S.recent, load:() => S.recent });

/* ============ playback ============ */
function playList(arr, i, ctx) { S.queue = arr.slice(); S.idx = i; S.ctx = (ctx && ctx.name) || "Your queue"; load(); }
function playShuffled(arr, name) { if (!arr.length) return; S.shuffle = true; playList(arr, Math.floor(Math.random() * arr.length), { name }); }
function load() {
  const t = cur(); if (!t) return; S.errs = 0;
  if (t.src === "deezer" && t.id && Date.now() - (t.ts || 0) >= 4 * 3600e3) { syncUi(); fresh(t).then(() => { if (cur() === t) start(t); }); return; }
  start(t);
}
function start(t) {
  audio.src = t.url; audio.defaultPlaybackRate = S.speed; audio.playbackRate = S.speed;
  audio.play().catch(() => toast("Tap play to start"));
  pushRecent(t); syncUi(); if (S.npView === "lyrics") showLyrics();
  if ("mediaSession" in navigator) { try { navigator.mediaSession.metadata = new MediaMetadata({ title:t.title, artist:t.artist, album:t.album || "", artwork:t.art ? [{ src:t.art, sizes:"512x512" }] : [] }); } catch (e) {} }
}
function pushRecent(t) { S.recent = [t].concat(S.recent.filter(x => x.key !== t.key)).slice(0, 40); store("recent", S.recent); }
function next(auto) {
  if (!S.queue.length) return;
  if (S.repeat === 2 && auto) { audio.currentTime = 0; audio.play(); return; }
  if (S.shuffle && S.queue.length > 1) { let n; do { n = Math.floor(Math.random() * S.queue.length); } while (n === S.idx); S.idx = n; }
  else if (S.idx < S.queue.length - 1) S.idx++;
  else if (S.repeat === 1 || !auto) S.idx = 0;
  else { syncUi(); return; }
  load();
}
function prev() { if (audio.currentTime > 3) { audio.currentTime = 0; return; } S.idx = S.idx > 0 ? S.idx - 1 : S.queue.length - 1; load(); }
const toggle = () => { if (!cur()) return; if (audio.paused) audio.play().catch(() => {}); else audio.pause(); };
function playNext(t) { if (!S.queue.length) { playList([t], 0); return; } S.queue.splice(S.idx + 1, 0, t); toast("Playing next"); syncUi(); }
function addQueue(t) { if (!S.queue.length) { playList([t], 0); return; } S.queue.push(t); toast("Added to queue"); syncUi(); }
function syncUi() {
  const t = cur(); if (!t) return;
  $("#mini").classList.add("on");
  $("#mImg").src = t.art || PX; $("#mT").textContent = t.title; $("#mA").textContent = t.artist;
  $("#art").src = t.art || PX; $("#nTitle").textContent = t.title; $("#nArtist").innerHTML = '<span data-act="npArtist" style="text-decoration:underline;text-decoration-color:rgba(255,255,255,.3)">' + esc(t.artist) + "</span>" + (t.full ? "" : ' <span class="tag" style="margin-left:6px">30s preview</span>');
  $("#nCtx").textContent = S.ctx;
  const lk = isLiked(t);
  [$("#nLike"), $("#mLike")].forEach(b => { b.innerHTML = ic(lk ? "heartF" : "heart", 24); b.classList.toggle("on", lk); });
  $("#bShuf").classList.toggle("on", S.shuffle); $("#bRep").classList.toggle("on", S.repeat > 0); $("#bRep").innerHTML = ic(S.repeat === 2 ? "repeat1" : "repeat");
  $("#bLyr").innerHTML = ic("lyrics", 22); $("#bQ").innerHTML = ic("queue", 22); $("#bSleep").innerHTML = ic("moon", 22);
  $("#bLyr").classList.toggle("on", S.npView === "lyrics"); $("#bQ").classList.toggle("on", S.npView === "queue"); $("#bSleep").classList.toggle("on", !!S.sleepEnd);
  $("#bSpd").textContent = S.speed + "×"; $("#bSpd").classList.toggle("on", S.speed !== 1);
  $$(".row[data-k]").forEach(r => r.classList.toggle("now", r.dataset.k === t.key));
  setPlayIcon(); if (S.npView === "queue") renderQueue();
}
function setPlayIcon() { const i = ic(audio.paused ? "play" : "pause", 28); $("#mPlay").innerHTML = i; $("#bPlay").innerHTML = ic(audio.paused ? "play" : "pause", 34); }
function renderQueue() {
  const el = $("#npQ"), lid = reg(S.queue);
  el.innerHTML = '<div class="muted" style="margin-bottom:6px">Now playing & up next · ' + S.queue.length + " songs</div>" + S.queue.map((t, i) => '<div class="q-row' + (i === S.idx ? " now" : "") + '" data-act="qjump" data-i="' + i + '">' + imgH(t.art, "sq") + '<div class="meta"><div class="t">' + esc(t.title) + '</div><div class="a">' + esc(t.artist) + '</div></div>' + (i !== S.idx ? '<button class="ib" data-act="qdel" data-i="' + i + '" aria-label="Remove">' + ic("x", 18) + "</button>" : "") + "</div>").join("");
  const n = el.querySelector(".now"); if (n && n.scrollIntoView) n.scrollIntoView({ block:"center" });
}
async function showLyrics() {
  const t = cur(), box = $("#npLyr"); if (!t) return;
  box.className = ""; box.innerHTML = '<p style="color:var(--sub);font-size:16px;font-weight:600">Finding lyrics…</p>';
  const l = await getLyrics(t); if (cur() !== t || S.npView !== "lyrics") return;
  if (!l) { box.innerHTML = '<p style="color:var(--sub);font-size:16px;font-weight:600">No lyrics found for this song.</p>'; return; }
  S.lyrNow = -1; box.className = l.synced ? "" : "plain"; box.innerHTML = l.lines.map((x, i) => '<p data-i="' + i + '">' + esc(x.x || "♪") + "</p>").join("");
}
function lyricTick(c) {
  if (S.npView !== "lyrics") return; const t = cur(), l = t && S.lyr[t.key]; if (!l || !l.synced) return;
  let a = -1; for (let i = 0; i < l.lines.length; i++) { if (l.lines[i].t <= c + 0.15) a = i; else break; }
  if (a === S.lyrNow) return; S.lyrNow = a; const ps = $$("#npLyr p"); ps.forEach((p, i) => p.classList.toggle("on", i === a));
  if (ps[a] && ps[a].scrollIntoView) ps[a].scrollIntoView({ block:"center", behavior:"smooth" });
}
function setNpView(v) {
  S.npView = S.npView === v ? "art" : v;
  $("#artWrap").hidden = S.npView !== "art"; $("#npLyr").hidden = S.npView !== "lyrics"; $("#npQ").hidden = S.npView !== "queue";
  if (S.npView === "lyrics") showLyrics(); if (S.npView === "queue") renderQueue(); syncUi();
}
function sleepSheet() {
  sheet('<div class="sh-grab"></div><div class="sh-head"><div class="meta"><div class="t">Sleep timer</div><div class="a">' + (S.sleepEnd ? "Pauses in " + Math.max(1, Math.round((S.sleepEnd - Date.now()) / 6e4)) + " min" : "Playback pauses when the timer ends") + "</div></div></div>" +
    [15, 30, 45, 60].map(m => '<button class="sh-item" data-act="sleep" data-m="' + m + '">' + ic("moon", 22) + m + " minutes</button>").join("") + '<button class="sh-item" data-act="sleep" data-m="0">' + ic("x", 22) + "Turn off</button>");
}
function setSleep(m) { clearTimeout(S.sleepT); S.sleepEnd = 0; if (m) { S.sleepEnd = Date.now() + m * 6e4; S.sleepT = setTimeout(() => { audio.pause(); S.sleepEnd = 0; syncUi(); toast("Sleep timer: paused"); }, m * 6e4); toast("Sleeping in " + m + " min"); } else toast("Sleep timer off"); closeSheet(); syncUi(); }

audio.addEventListener("play", setPlayIcon); audio.addEventListener("pause", setPlayIcon);
audio.addEventListener("ended", () => next(true));
audio.addEventListener("error", () => { if (!cur()) return; if (++S.errs > 3) { toast("Can't play right now. Check your connection."); return; } toast("Skipping a song that wouldn't play"); setTimeout(() => next(true), 600); });
let seeking = false;
audio.addEventListener("timeupdate", () => {
  const d = audio.duration || (cur() && cur().dur) || 0, c = audio.currentTime || 0;
  $("#tCur").textContent = fmt(c); $("#tDur").textContent = fmt(d); if (d && !seeking) $("#seek").value = Math.floor(c / d * 1000);
  $("#miniFill").style.width = (d ? c / d * 100 : 0) + "%"; lyricTick(c);
  if ("mediaSession" in navigator && navigator.mediaSession.setPositionState && isFinite(d) && d > 0) { try { navigator.mediaSession.setPositionState({ duration:d, position:Math.min(c, d), playbackRate:S.speed }); } catch (e) {} }
});
$("#seek").addEventListener("input", function () { seeking = true; $("#tCur").textContent = fmt(this.value / 1000 * (audio.duration || 0)); });
$("#seek").addEventListener("change", function () { const d = audio.duration || 0; if (d) audio.currentTime = this.value / 1000 * d; seeking = false; });
if ("mediaSession" in navigator) { try { const m = navigator.mediaSession; m.setActionHandler("play", toggle); m.setActionHandler("pause", toggle); m.setActionHandler("nexttrack", () => next(false)); m.setActionHandler("previoustrack", prev); } catch (e) {} }

/* ============ likes, playlists, menus ============ */
function toggleLike(t) { const i = S.liked.findIndex(x => x.key === t.key); if (i > -1) { S.liked.splice(i, 1); toast("Removed from Liked Songs"); } else { S.liked.unshift(t); toast("Added to Liked Songs"); } store("liked", S.liked); }
function sheet(h) { $("#sheetBox").innerHTML = h; $("#sheet").classList.add("on"); }
function closeSheet() { $("#sheet").classList.remove("on"); }
function trackMenu(t, ctx) {
  S.mt = t; S.mctx = ctx || null; const lk = isLiked(t);
  sheet('<div class="sh-grab"></div><div class="sh-head">' + imgH(t.art, "sq") + '<div class="meta"><div class="t">' + esc(t.title) + '</div><div class="a">' + esc(t.artist) + "</div></div></div>" +
    '<button class="sh-item" data-act="m-next">' + ic("next", 22) + "Play next</button>" +
    '<button class="sh-item" data-act="m-queue">' + ic("queue", 22) + "Add to queue</button>" +
    '<button class="sh-item" data-act="m-like">' + ic(lk ? "heartF" : "heart", 22) + (lk ? "Remove from Liked Songs" : "Add to Liked Songs") + "</button>" +
    '<button class="sh-item" data-act="m-pl">' + ic("plus", 22) + "Add to playlist</button>" +
    (t.artistRef ? '<button class="sh-item" data-act="m-artist">' + ic("user", 22) + "Go to artist</button>" : "") +
    (ctx && ctx.playlist ? '<button class="sh-item" data-act="m-rm">' + ic("trash", 22) + "Remove from this playlist</button>" : "") +
    (t.link ? '<a class="sh-item" href="' + esc(t.link) + '" target="_blank" rel="noopener">' + ic("link", 22) + "Open original</a>" : ""));
}
function plSheet() {
  const names = Object.keys(S.playlists);
  sheet('<div class="sh-grab"></div><div class="sh-head"><div class="meta"><div class="t">Add to playlist</div></div></div>' + names.map(n => '<button class="sh-item" data-act="addto" data-n="' + esc(n) + '">' + ic("music", 22) + esc(n) + "</button>").join("") +
    '<div class="newpl" style="margin:10px 4px 0"><input class="sheet-in" id="shName" type="text" placeholder="New playlist" maxlength="40"><button class="btn" data-act="addnew">Create</button></div>');
}
function addToPl(n, t) { n = (n || "").trim(); if (!n) return; const a = S.playlists[n] = S.playlists[n] || []; if (!a.some(x => x.key === t.key)) a.push(t); store("playlists", S.playlists); toast("Added to " + n); closeSheet(); if (S.tab === "library") renderLibrary(); }
function goArtist(ref) { $("#now").classList.remove("on"); openCard({ kind:"artist", src:ref.src, id:ref.id, name:ref.name, img:ref.img, sub:"Artist" }); }

/* ============ photo picker ============ */
let pickSlot = "A";
function handleFile(f) {
  if (!f) return; const rd = new FileReader();
  rd.onload = () => { const im = new Image(); im.onload = () => {
    const sc = Math.min(1, 1300 / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
    c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); const d = c.toDataURL("image/jpeg", .82);
    if (pickSlot === "A") { S.photoA = d; store("photoA", d); } else { S.photoB = d; store("photoB", d); } applyBg(S.tab); toast("Wallpaper " + pickSlot + " updated");
  }; im.src = rd.result; }; rd.readAsDataURL(f);
}

/* ============ events ============ */
document.addEventListener("click", e => {
  const tb = e.target.closest("#tabs button"); if (tb) { go(tb.dataset.tab); return; }
  const el = e.target.closest("[data-act]"); if (!el) return; const act = el.dataset.act;
  const L = el.dataset.l ? lists[el.dataset.l] : null, tr = L ? L.arr[+el.dataset.i] : null, ctx = L ? L.ctx : null;
  switch (act) {
    case "play": if (ctx && ctx.all && ctx.name) { playList(ctx.all, ctx.all.indexOf(tr), ctx); } else playList(L.arr, +el.dataset.i, ctx); saveQuery(S.q); break;
    case "like": e.stopPropagation(); toggleLike(tr); el.classList.toggle("on", isLiked(tr)); el.innerHTML = ic(isLiked(tr) ? "heartF" : "heart", 22); if (S.tab === "library" && !S.pages.length) renderLibrary(); if (cur()) syncUi(); break;
    case "more": e.stopPropagation(); trackMenu(tr, ctx); break;
    case "tab": go(el.dataset.t); break;
    case "genre": S.gi = +el.dataset.i; renderHome(); break;
    case "seeall": { const d = S.shelfData[el.dataset.id]; if (d) openPage({ title:d.title, sub:d.arr.length + " songs", mosaic:d.arr, load:() => d.arr }); break; }
    case "open": openCard(objs[el.dataset.o]); break;
    case "back": S.pages.pop(); renderPage(); break;
    case "pgPlay": playList(S.pageTracks, 0, { name:(S.pages[S.pages.length - 1] || {}).title }); break;
    case "pgShuf": playShuffled(S.pageTracks, (S.pages[S.pages.length - 1] || {}).title); break;
    case "pgDel": { const sp = S.pages[S.pages.length - 1]; if (sp && sp.ctx && sp.ctx.playlist) { delete S.playlists[sp.ctx.playlist]; store("playlists", S.playlists); toast("Playlist deleted"); S.pages.pop(); renderPage(); if (S.tab === "library") renderLibrary(); } break; }
    case "openLiked": openLiked(); break; case "openRecent": openRecent(); break; case "openPl": openPlaylist(el.dataset.n); break;
    case "playLiked": playList(S.liked, 0, { name:"Liked Songs" }); break; case "shufLiked": playShuffled(S.liked, "Liked Songs"); break;
    case "libtab": S.lt = el.dataset.v; renderLibrary(); break;
    case "newpl": { const n = $("#plName").value.trim(); if (n) { S.playlists[n] = S.playlists[n] || []; store("playlists", S.playlists); renderLibrary(); } break; }
    case "clearRecent": S.recent = []; store("recent", []); toast("History cleared"); if (S.tab === "library") renderLibrary(); break;
    case "srcmode": S.srcMode = el.dataset.v; store("srcMode", S.srcMode); if (S.tab === "settings") renderSettings(); else { renderSBody(); if (S.q.length > 1) runSearch(S.q); } toast("Source: " + ({ all:"All", audius:"Full songs (Audius)", deezer:"Deezer", itunes:"iTunes" })[S.srcMode]); break;
    case "sfilter": S.sf = el.dataset.v; renderSBody(); break;
    case "useq": { const q = el.dataset.q; $("#q").value = q; $("#qx").hidden = false; S.q = q; saveQuery(q); runSearch(q); break; }
    case "delq": e.stopPropagation(); S.recentQ.splice(+el.dataset.i, 1); store("recentQ", S.recentQ); renderSBody(); break;
    case "clearq": S.recentQ = []; store("recentQ", []); if (S.tab === "search") renderSBody(); else toast("Searches cleared"); break;
    case "slot": S.bgSlot[el.dataset.s] = el.dataset.v; store("bgSlot", S.bgSlot); renderSettings(); applyBg(S.tab); break;
    case "pick": pickSlot = el.dataset.slot; $("#file").click(); break;
    case "resetbg": S.photoA = ""; S.photoB = ""; store("photoA", ""); store("photoB", ""); applyBg(S.tab); toast("Original wallpapers restored"); break;
    case "m-next": playNext(S.mt); closeSheet(); break; case "m-queue": addQueue(S.mt); closeSheet(); break;
    case "m-like": toggleLike(S.mt); closeSheet(); if (cur()) syncUi(); if (S.tab === "library" && !S.pages.length) renderLibrary(); break;
    case "m-pl": plSheet(); break;
    case "m-artist": closeSheet(); goArtist(S.mt.artistRef); break;
    case "m-rm": { const n = S.mctx && S.mctx.playlist; if (n) { S.playlists[n] = S.playlists[n].filter(x => x.key !== S.mt.key); store("playlists", S.playlists); toast("Removed"); closeSheet(); renderPage(); } break; }
    case "addto": addToPl(el.dataset.n, S.mt); break;
    case "addnew": addToPl($("#shName").value, S.mt); break;
    case "qjump": S.idx = +el.dataset.i; load(); break;
    case "qdel": e.stopPropagation(); { const i = +el.dataset.i; S.queue.splice(i, 1); if (i < S.idx) S.idx--; renderQueue(); } break;
    case "sleep": setSleep(+el.dataset.m); break;
    case "npArtist": { const t = cur(); if (t && t.artistRef) goArtist(t.artistRef); break; }
  }
});
document.addEventListener("change", e => { if (e.target.id === "file") { handleFile(e.target.files[0]); e.target.value = ""; } });
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });
$("#page").addEventListener("scroll", () => { const t = $("#pgT"); if (t) t.style.opacity = $("#page").scrollTop > 150 ? 1 : 0; });
$("#mPlay").onclick = toggle; $("#bPlay").onclick = toggle; $("#bNext").onclick = () => next(false); $("#bPrev").onclick = prev;
$("#mOpen").onclick = () => { applyBg("now"); $("#now").classList.add("on"); };
$("#mImg").onclick = () => { applyBg("now"); $("#now").classList.add("on"); };
$("#nClose").onclick = () => $("#now").classList.remove("on");
$("#nLike").onclick = () => { const t = cur(); if (t) { toggleLike(t); syncUi(); } };
$("#mLike").onclick = $("#nLike").onclick;
$("#nMore").onclick = () => { const t = cur(); if (t) trackMenu(t, null); };
$("#bShuf").onclick = () => { S.shuffle = !S.shuffle; syncUi(); };
$("#bRep").onclick = () => { S.repeat = (S.repeat + 1) % 3; syncUi(); };
$("#bLyr").onclick = () => setNpView("lyrics"); $("#bQ").onclick = () => setNpView("queue"); $("#bSleep").onclick = sleepSheet;
$("#bSpd").onclick = () => { const o = [1, 1.25, 1.5, 2, 0.75]; S.speed = o[(o.indexOf(S.speed) + 1) % o.length]; audio.playbackRate = S.speed; audio.defaultPlaybackRate = S.speed; syncUi(); };

hydrate(); setPlayIcon(); go("home");
</script>
